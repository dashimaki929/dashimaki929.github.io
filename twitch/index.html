<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Stream Viewer</title>
<style>
  :root {
    --bg: #1e1f22;
    --bg2: #2b2d31;
    --bg3: #313338;
    --text: #dbdee1;
    --muted: #949ba4;
    --accent: #5865f2;
    --green: #23a55a;
    --red: #f23f43;
    --twitch: #9146ff;
    --gap: 8px;
    --bar-h: 52px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: "gg sans", "Noto Sans JP", "Hiragino Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- top bar ---------- */
  #bar { height: var(--bar-h); display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--bg); border-bottom: 1px solid #111214; }
  .brand { font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--twitch); }
  #addForm { display: flex; gap: 6px; }
  #chInput { width: 320px; background: var(--bg3); border: 1px solid transparent; border-radius: 6px;
    color: var(--text); padding: 7px 10px; outline: none; }
  #chInput:focus { border-color: var(--accent); }
  .btn { background: var(--bg3); border: 0; border-radius: 6px; padding: 7px 12px; white-space: nowrap; }
  .btn:hover { background: #3f4147; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: #4752c4; }
  .btn.on { background: var(--accent); color: #fff; }
  #chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { display: flex; align-items: center; gap: 4px; background: var(--bg2); border-radius: 999px;
    padding: 3px 4px 3px 10px; font-size: 13px; white-space: nowrap; }
  .chip.focused { background: var(--accent); color: #fff; }
  .chip span { cursor: pointer; }
  .chip button { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%;
    line-height: 1; padding: 0; opacity: .7; }
  .chip button:hover { background: rgba(255,255,255,.15); opacity: 1; }

  /* ---------- main area ---------- */
  #wrap { position: absolute; top: var(--bar-h); left: 0; right: 0; bottom: 0; display: flex; }
  #stage { position: relative; flex: 1; min-width: 0; margin: var(--gap); }
  #chat { width: 340px; display: none; flex-direction: column; background: var(--bg2); border-left: 1px solid #111214; }
  body.chat-open #chat { display: flex; }
  #chatHead { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #111214; }
  #chatSel { flex: 1; background: var(--bg3); color: var(--text); border: 0; border-radius: 6px; padding: 6px; }
  #chatFrame { flex: 1; border: 0; width: 100%; }

  /* ---------- tiles ---------- */
  .tile { position: absolute; border-radius: 8px; overflow: hidden; background: var(--bg3);
    transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease;
    box-shadow: 0 0 0 0 transparent; }
  body.no-anim .tile { transition: none; }
  .tile.main { z-index: 2; }
  /* 音が出ている配信は緑枠（Discord の発言中表示と同じ） */
  .tile.audible { box-shadow: 0 0 0 3px var(--green); }
  .tile.audible .label { background: rgba(35,165,90,.85); }
  .tile .player, .tile .player iframe { position: absolute; inset: 0; width: 100% !important; height: 100% !important; border: 0; }
  .tile .catcher { position: absolute; inset: 0; cursor: pointer; z-index: 3; }
  /* 下部（再生・音量・画質バー）はプレイヤーを直接操作できるように空ける（小さいサムネイル以外） */
  .tile:not(.small) .catcher { bottom: 56px; }
  .tile:fullscreen { border-radius: 0; box-shadow: none; }
  .tile:fullscreen .catcher { cursor: default; }
  .tile:not(.main):not(.audible):hover { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .tile .label { position: absolute; left: 8px; bottom: 8px; z-index: 4; display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.6); border-radius: 4px; padding: 3px 8px; font-size: 13px; font-weight: 600;
    max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .tile.main .label { bottom: auto; top: 8px; }
  .tile .label .snd { font-size: 12px; }
  .tile .tools { position: absolute; right: 8px; top: 8px; z-index: 5; display: flex; gap: 4px;
    opacity: 0; transition: opacity .15s; }
  .tile:hover .tools { opacity: 1; }
  .tile .tools button { width: 30px; height: 30px; border: 0; border-radius: 6px; background: rgba(0,0,0,.65);
    display: grid; place-items: center; font-size: 14px; padding: 0; }
  .tile .tools button:hover { background: rgba(0,0,0,.9); }
  .tile .tools button.close:hover { background: var(--red); }
  .tile.small .label { font-size: 11px; padding: 2px 6px; left: 4px; bottom: 4px; }
  .tile.small .tools { top: 4px; right: 4px; }
  .tile.small .tools button { width: 24px; height: 24px; font-size: 12px; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: 13px; padding: 12px; background: linear-gradient(135deg, #2b2d31, #232428); }

  /* ---------- platform badge ---------- */
  .pf { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .pf-twitch .pf { background: var(--twitch); }
  .pf-youtube .pf { background: #ff0033; }
  .chip .pf { margin-right: 6px; }
  .chip.focused .pf { box-shadow: 0 0 0 1px #fff; }

  /* ---------- context menu (Discord 風) ---------- */
  #ctx { position: fixed; z-index: 100; display: none; min-width: 220px; padding: 6px;
    background: #111214; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 14px; user-select: none; }
  #ctx.open { display: block; }
  #ctx .hd { padding: 6px 8px 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
  #ctx .vol { padding: 4px 8px 10px; }
  #ctx .vol-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #ctx .vol-top b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
  #ctx input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  #ctx .sep { height: 1px; background: #2e2f34; margin: 4px 6px; }
  #ctx .it { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 7px 8px; border: 0; background: transparent; border-radius: 4px; text-align: left; }
  #ctx .it:hover { background: var(--accent); color: #fff; }
  #ctx .it.danger { color: var(--red); }
  #ctx .it.danger:hover { background: var(--red); color: #fff; }
  #ctx .box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #80848e; display: grid; place-items: center; font-size: 12px; }
  #ctx .box.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- empty / warn ---------- */
  #empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: var(--muted); }
  #empty h2 { color: var(--text); margin: 0 0 8px; }
  body.is-empty #empty { display: grid; }
  #warn { display: none; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
    background: var(--red); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: 90vw; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(80px); z-index: 60;
    background: var(--bg3); padding: 8px 14px; border-radius: 8px; font-size: 13px; transition: transform .2s; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  kbd { background: var(--bg3); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  @media (max-width: 760px) {
    #chInput { width: 150px; }
    .brand span { display: none; }
    #chat { position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; width: min(340px, 90vw); }
  }
</style>
</head>
<body class="is-empty">

<header id="bar">
  <div class="brand"><span>Multi Stream</span></div>
  <form id="addForm" autocomplete="off">
    <input id="chInput" placeholder="Twitch名 / Twitch・YouTube の URL（カンマ区切り可）">
    <button class="btn primary" type="submit">追加</button>
  </form>
  <div id="chips"></div>
  <button class="btn" id="gridBtn" title="グリッドに戻る (Esc)">▦</button>
  <button class="btn" id="chatBtn" title="チャット表示 (C)">💬</button>
  <button class="btn" id="shareBtn" title="この構成のURLをコピー">🔗</button>
</header>

<main id="wrap">
  <div id="stage">
    <div id="empty">
      <div>
        <h2>配信を追加してください</h2>
        <div>上の入力欄に Twitch のチャンネル名、または Twitch / YouTube の配信 URL を入れて「追加」</div>
        <div style="margin-top:14px;font-size:13px">
          クリックで大画面 ／ <kbd>Esc</kbd> でグリッドに戻る ／ <kbd>1</kbd>〜<kbd>9</kbd> で切替 ／ <kbd>C</kbd> でチャット
        </div>
      </div>
    </div>
  </div>
  <aside id="chat">
    <div id="chatHead">
      <select id="chatSel"></select>
      <button class="btn" id="chatClose" title="閉じる">✕</button>
    </div>
    <iframe id="chatFrame" title="chat"></iframe>
  </aside>
</main>

<div id="ctx" role="menu">
  <div class="hd" id="ctxName"></div>
  <div class="vol">
    <div class="vol-top"><span>音量</span><b id="ctxVolVal">50%</b></div>
    <input type="range" id="ctxVol" min="0" max="100" step="1">
  </div>
  <button class="it" id="ctxMute"><span>ミュート</span><span class="box" id="ctxMuteBox"></span></button>
  <div class="sep"></div>
  <button class="it" id="ctxFocus"></button>
  <button class="it" id="ctxFull">全画面で表示</button>
  <button class="it" id="ctxOpen">開く ↗</button>
  <div class="sep"></div>
  <button class="it danger" id="ctxRemove">この配信を閉じる</button>
</div>

<div id="warn"></div>
<div id="toast"></div>

<script>
(() => {
  "use strict";

  const HOST = location.hostname;            // Twitch 埋め込みの parent / YouTube チャットの embed_domain に必須
  const ASPECT = 16 / 9;
  const STORE_KEY = "multi-twitch:channels"; // 以前の保存データをそのまま引き継ぐためキー名は据え置き
  // YouTube の配信ごとの音量（次回も同じ音量で開く）。
  // Twitch はログイン中のアカウントの音量設定を Twitch 側が反映するので、こちらでは保存・上書きしない
  const VOL_KEY = "multi-twitch:volumes";
  const DEFAULT_VOLUME = 0.5;
  let volStore = {};
  try { volStore = JSON.parse(localStorage.getItem(VOL_KEY) || "{}") || {}; } catch (_) {}
  function rememberVolume(ch, v) {
    if (!isYT(ch) || !(v > 0)) return;   // Twitch は対象外 / 0 はミュート扱いなので保存しない
    volStore[ch] = Math.round(v * 100) / 100;
    try { localStorage.setItem(VOL_KEY, JSON.stringify(volStore)); } catch (_) {}
  }

  const $ = (s) => document.querySelector(s);
  const stage = $("#stage"), chips = $("#chips");

  /**
   * 配信キー
   *   Twitch            : "channelname"
   *   YouTube (動画ID)  : "yt:VIDEO_ID"
   *   YouTube (チャンネルのライブ) : "ytc:UCxxxxxxxx"
   */
  let channels = [];          // 表示順（配信キーの配列）
  let focused = null;         // 大画面中の配信キー
  let chatChannel = null;
  const tiles = new Map();    // key -> { el, api, ready, muted, volume, name, videoId, ... }

  // ---------- 外部スクリプト（非同期ロード） ----------
  function loadScript(src, check) {
    return new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => resolve(check());
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  }
  let twitchP = null, ytP = null;
  const twitchReady = () => twitchP ||= (HOST ? loadScript("https://player.twitch.tv/js/embed/v1.js", () => !!window.Twitch) : Promise.resolve(false));
  const ytReady = () => ytP ||= new Promise((resolve) => {
    if (window.YT && window.YT.Player) return resolve(true);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); resolve(true); };
    loadScript("https://www.youtube.com/iframe_api", () => true).then((ok) => { if (!ok) resolve(false); });
    setTimeout(() => resolve(!!(window.YT && window.YT.Player)), 15000);
  });

  if (!HOST) {
    showWarn("ファイルを直接開いている（file://）ため埋め込みが動きません。GitHub Pages か localhost で開いてください。");
  }

  // ---------- 入力の解析 ----------
  const YT_ID = /^[A-Za-z0-9_-]{11}$/;
  const YT_CH = /^UC[A-Za-z0-9_-]{22}$/;

  function toKey(s) {
    let m;
    if ((m = s.match(/^yt:([A-Za-z0-9_-]{11})$/))) return "yt:" + m[1];
    if ((m = s.match(/^ytc:(UC[A-Za-z0-9_-]{22})$/))) return "ytc:" + m[1];
    if (/(^|\.|\/)(youtube\.com|youtu\.be)/i.test(s)) {
      let u;
      try { u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s); } catch (_) { return { error: "url" }; }
      const v = u.searchParams.get("v");
      if (v && YT_ID.test(v)) return "yt:" + v;
      if (/youtu\.be$/i.test(u.hostname) && (m = u.pathname.match(/^\/([A-Za-z0-9_-]{11})/))) return "yt:" + m[1];
      if ((m = u.pathname.match(/^\/(?:live|embed|shorts|v)\/([A-Za-z0-9_-]{11})/))) return "yt:" + m[1];
      if ((m = u.pathname.match(/^\/channel\/(UC[A-Za-z0-9_-]{22})/))) return "ytc:" + m[1];
      if (/^\/@/.test(u.pathname)) return { error: "handle" };
      return { error: "url" };
    }
    if ((m = s.match(/twitch\.tv\/([A-Za-z0-9_]+)/i))) s = m[1];
    s = s.replace(/^@/, "").toLowerCase();
    return /^[a-z0-9_]{2,25}$/.test(s) ? s : { error: "name" };
  }

  function parseInput(text) {
    const ok = [], errors = [];
    for (const raw of text.split(/[\s,、]+/)) {
      const s = raw.trim(); if (!s) continue;
      const k = toKey(s);
      if (typeof k === "string") ok.push(k); else errors.push(k.error);
    }
    return { ok, errors };
  }

  const isYT = (key) => key.startsWith("yt:") || key.startsWith("ytc:");
  const ytId = (key) => key.slice(key.indexOf(":") + 1);

  function defaultName(key) {
    if (key.startsWith("yt:")) return "YouTube " + ytId(key);
    if (key.startsWith("ytc:")) return "YouTube ライブ";
    return key;
  }
  const nameOf = (key) => tiles.get(key)?.name || defaultName(key);

  function watchUrl(key) {
    const t = tiles.get(key);
    if (key.startsWith("yt:")) return "https://www.youtube.com/watch?v=" + ytId(key);
    if (key.startsWith("ytc:")) return t?.videoId ? "https://www.youtube.com/watch?v=" + t.videoId
                                                   : "https://www.youtube.com/channel/" + ytId(key) + "/live";
    return "https://www.twitch.tv/" + key;
  }

  // ---------- helpers ----------
  function showWarn(msg) { const w = $("#warn"); w.textContent = msg; w.style.display = "block"; }
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function save() {
    const url = new URL(location.href);
    if (channels.length) url.searchParams.set("c", channels.join(","));
    else url.searchParams.delete("c");
    history.replaceState(null, "", url);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(channels)); } catch (_) {}
  }

  function load() {
    const q = new URLSearchParams(location.search).get("c");
    if (q) return parseInput(q.replace(/,/g, " ")).ok;
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (_) { return []; }
  }

  // ---------- tiles ----------
  function createTile(ch) {
    const el = document.createElement("div");
    el.className = "tile " + (isYT(ch) ? "pf-youtube" : "pf-twitch");
    el.innerHTML = `
      <div class="player"></div>
      <div class="catcher" title="クリックで大画面"></div>
      <div class="label"><span class="pf"></span><span class="snd"></span><span class="nm"></span></div>
      <div class="tools">
        <button class="mute" title="ミュート切替">🔇</button>
        <button class="focus" title="大画面 / 戻す">⛶</button>
        <button class="close" title="閉じる">✕</button>
      </div>`;
    const t = { el, api: null, muted: true, ready: false, volume: volStore[ch] ?? DEFAULT_VOLUME, name: null, videoId: null };
    tiles.set(ch, t);
    el.querySelector(".nm").textContent = nameOf(ch);

    // クリック：小さい配信 → 大画面に / 大画面の配信 → 等分割に戻す
    // ダブルクリック：全画面（シングルクリックと区別するため、大画面側は少し待ってから判定）
    const catcher = el.querySelector(".catcher");
    let clickTimer = null;
    catcher.addEventListener("click", () => {
      if (focused !== ch) { setFocus(ch); return; }
      if (document.fullscreenElement) return;   // 全画面中のシングルクリックは無視
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickTimer = null; setFocus(null); }, 250);
    });
    catcher.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      clearTimeout(clickTimer); clickTimer = null;
      openCtx(ch, e.clientX, e.clientY);
    });
    catcher.addEventListener("dblclick", () => {
      clearTimeout(clickTimer); clickTimer = null;
      if (focused !== ch) setFocus(ch);
      toggleFullscreen(el);
    });
    el.querySelector(".focus").addEventListener("click", (e) => { e.stopPropagation(); setFocus(focused === ch ? null : ch); });
    el.querySelector(".mute").addEventListener("click", (e) => { e.stopPropagation(); setMuted(ch, !t.muted); });
    el.querySelector(".close").addEventListener("click", (e) => { e.stopPropagation(); removeChannel(ch); });

    stage.appendChild(el);
    updateTileUI(ch);

    (isYT(ch) ? mountYouTube : mountTwitch)(ch, t, el.querySelector(".player"));
    return t;
  }

  function failTile(ch, t, box, msg) {
    const d = document.createElement("div");
    d.className = "placeholder";
    d.textContent = `${nameOf(ch)}\n（${msg}）`;
    d.style.whiteSpace = "pre-line";
    box.replaceChildren(d);
  }

  // --- Twitch ---
  function mountTwitch(ch, t, box) {
    twitchReady().then((ok) => {
      if (tiles.get(ch) !== t) return;
      if (!ok) return failTile(ch, t, box, "Twitch の埋め込みを読み込めませんでした");
      box.id = "p-" + Math.random().toString(36).slice(2, 9);
      const p = new Twitch.Player(box.id, {
        channel: ch, parent: [HOST], width: "100%", height: "100%",
        autoplay: true, muted: true,
      });
      t.api = {
        getMuted: () => p.getMuted(),
        setMuted: (m) => p.setMuted(m),
        getVolume: () => p.getVolume(),
        setVolume: (v) => p.setVolume(v),
        pause: () => p.pause(),
      };
      p.addEventListener(Twitch.Player.READY, () => onPlayerReady(ch));
    });
  }

  // --- YouTube ---
  function mountYouTube(ch, t, box) {
    ytReady().then((ok) => {
      if (tiles.get(ch) !== t) return;
      if (!ok) return failTile(ch, t, box, "YouTube の埋め込みを読み込めませんでした");
      const params = new URLSearchParams({ autoplay: "1", mute: "1", enablejsapi: "1", playsinline: "1", rel: "0" });
      if (/^https?:$/.test(location.protocol)) params.set("origin", location.origin);
      const id = ytId(ch);
      const iframe = document.createElement("iframe");
      iframe.src = ch.startsWith("ytc:")
        ? `https://www.youtube.com/embed/live_stream?channel=${id}&${params}`
        : `https://www.youtube.com/embed/${id}?${params}`;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      iframe.allowFullscreen = true;
      iframe.title = "YouTube";
      box.appendChild(iframe);

      const updateMeta = () => {
        try {
          const d = p.getVideoData() || {};
          if (d.video_id && d.video_id !== t.videoId) {
            t.videoId = d.video_id;
            if (chatChannel === ch) setChat(ch, true);   // ライブの動画IDがわかったらチャットを出し直す
          }
          if (d.author && d.author !== t.name) setName(ch, d.author);
        } catch (_) {}
      };
      const p = new YT.Player(iframe, {
        events: {
          onReady: () => { onPlayerReady(ch); updateMeta(); try { p.playVideo(); } catch (_) {} },
          onStateChange: updateMeta,
        },
      });
      t.api = {
        getMuted: () => p.isMuted(),
        setMuted: (m) => (m ? p.mute() : p.unMute()),
        getVolume: () => p.getVolume() / 100,
        setVolume: (v) => p.setVolume(Math.round(v * 100)),
        pause: () => p.pauseVideo(),
      };
    });
  }

  function setName(ch, name) {
    const t = tiles.get(ch); if (!t) return;
    t.name = name;
    t.el.querySelector(".nm").textContent = name;
    if (ctxCh === ch) $("#ctxName").textContent = name;
    renderChips(); renderChatSelect();
  }

  // プレイヤーの準備ができたら音量とミュート状態を反映
  //   YouTube: 保存してある音量（なければ 50%） / Twitch: Twitch 側の音量をそのまま採用
  function onPlayerReady(ch) {
    const t = tiles.get(ch); if (!t || !t.api) return;
    t.ready = true; t.touched = Date.now();
    try {
      if (isYT(ch)) t.api.setVolume(t.volume > 0 ? t.volume : DEFAULT_VOLUME);
      else { const v = t.api.getVolume(); if (v > 0) t.volume = v; }   // Twitch はプレイヤーの音量をそのまま使う
    } catch (_) {}
    applyMuted(ch);
  }

  function applyMuted(ch) {
    const t = tiles.get(ch);
    if (!t || !t.api || !t.ready) return;
    try {
      t.api.setMuted(t.muted);
      if (!t.muted && t.api.getVolume() < 0.01) t.api.setVolume(t.volume || 0.5);
    } catch (_) {}
  }

  function setVolume(ch, v) {
    const t = tiles.get(ch); if (!t) return;
    t.volume = v; t.touched = Date.now(); rememberVolume(ch, v);
    if (t.api && t.ready) { try { t.api.setVolume(v); } catch (_) {} }
    // スライダーを動かしたらミュート解除、0 にしたらミュート（Discord と同じ挙動）
    if (v > 0 && t.muted) setMuted(ch, false);
    else if (v === 0 && !t.muted) setMuted(ch, true);
    updateTileUI(ch);
  }

  // ---------- context menu ----------
  const ctx = $("#ctx");
  let ctxCh = null;

  function syncCtx() {
    const t = tiles.get(ctxCh); if (!t) return;
    const pct = Math.round(t.volume * 100);
    $("#ctxVol").value = pct;
    $("#ctxVolVal").textContent = pct + "%";
    $("#ctxMuteBox").classList.toggle("on", t.muted);
    $("#ctxMuteBox").textContent = t.muted ? "✓" : "";
    $("#ctxFocus").textContent = focused === ctxCh ? "等分割に戻す" : "大画面で表示";
    $("#ctxOpen").textContent = (isYT(ctxCh) ? "YouTube" : "Twitch") + " で開く ↗";
  }

  function openCtx(ch, x, y) {
    const t = tiles.get(ch); if (!t) return;
    ctxCh = ch;
    // プレイヤー側のコントロールで変更された値も拾う
    if (t.api && t.ready) {
      try { t.volume = t.api.getVolume(); t.muted = t.api.getMuted(); updateTileUI(ch); } catch (_) {}
    }
    $("#ctxName").textContent = nameOf(ch);
    syncCtx();
    ctx.classList.add("open");
    const r = ctx.getBoundingClientRect();
    ctx.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
    ctx.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  }

  function closeCtx() { ctx.classList.remove("open"); ctxCh = null; }

  $("#ctxVol").addEventListener("input", (e) => {
    if (!ctxCh) return;
    setVolume(ctxCh, +e.target.value / 100);
    syncCtx();
  });
  $("#ctxMute").onclick = () => {
    const t = tiles.get(ctxCh); if (!t) return;
    setMuted(ctxCh, !t.muted); syncCtx();
  };
  $("#ctxFocus").onclick = () => { const ch = ctxCh; closeCtx(); setFocus(focused === ch ? null : ch); };
  $("#ctxFull").onclick = () => { const ch = ctxCh; closeCtx(); if (focused !== ch) setFocus(ch); toggleFullscreen(tiles.get(ch).el); };
  $("#ctxOpen").onclick = () => { window.open(watchUrl(ctxCh), "_blank", "noopener"); closeCtx(); };
  $("#ctxRemove").onclick = () => { const ch = ctxCh; closeCtx(); removeChannel(ch); };

  document.addEventListener("pointerdown", (e) => { if (ctxCh && !ctx.contains(e.target)) closeCtx(); }, true);
  document.addEventListener("contextmenu", (e) => { if (ctxCh && !e.target.closest(".catcher")) closeCtx(); });
  window.addEventListener("blur", () => { if (ctxCh) closeCtx(); });   // iframe 内をクリックした場合
  window.addEventListener("resize", closeCtx);

  function toggleFullscreen(el) {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  }

  // ---------- mute ----------
  // 大画面にする直前のミュート状態（大画面をやめたときに戻す）
  let preFocusMute = null;
  function rememberManual(ch, muted) {
    // 大画面中に小さい配信のミュートを手動で変えたら、その設定を優先して残す
    if (preFocusMute && preFocusMute.has(ch) && ch !== focused) preFocusMute.set(ch, muted);
  }

  // auto = true は大画面切り替えによる自動変更
  function setMuted(ch, muted, auto = false) {
    const t = tiles.get(ch); if (!t) return;
    if (!auto) rememberManual(ch, muted);
    if (!muted && t.volume < 0.01) t.volume = 0.5;   // 音量 0 のままミュート解除しても無音にならないように
    t.muted = muted; t.touched = Date.now(); applyMuted(ch); updateTileUI(ch);
  }

  function updateTileUI(ch) {
    const t = tiles.get(ch); if (!t) return;
    t.el.querySelector(".snd").textContent = t.muted ? "🔇" : "🔊";
    t.el.querySelector(".mute").textContent = t.muted ? "🔇" : "🔊";
    t.el.querySelector(".focus").textContent = focused === ch ? "▦" : "⛶";
    t.el.classList.toggle("main", focused === ch);
    t.el.classList.toggle("audible", !t.muted && t.volume > 0);
    t.el.querySelector(".catcher").title = focused === ch
      ? "クリックで等分割に戻す ／ ダブルクリックで全画面"
      : "クリックで大画面 ／ ダブルクリックで全画面";
  }

  // プレイヤー内のボタンでミュート/音量を変えた場合も枠とラベルを追従させる
  setInterval(() => {
    for (const [ch, t] of tiles) {
      // こちらで変更した直後はプレイヤー側の値がまだ古いことがあるので少し待つ
      if (!t.api || !t.ready || Date.now() - (t.touched || 0) < 2000) continue;
      try {
        const m = t.api.getMuted(), v = t.api.getVolume();
        if (m !== t.muted || Math.abs(v - t.volume) > 0.005) {
          if (m !== t.muted) rememberManual(ch, m);   // プレイヤー側のボタンで変えた場合も手動扱い
          if (Math.abs(v - t.volume) > 0.005) rememberVolume(ch, v);   // プレイヤー側で変えた音量も覚える
          t.muted = m; t.volume = v; updateTileUI(ch);
          if (ctxCh === ch) syncCtx();
        }
      } catch (_) {}
    }
  }, 1000);

  // ---------- channel ops ----------
  function addChannels(list) {
    let added = 0;
    for (const ch of list) {
      if (channels.includes(ch)) continue;
      channels.push(ch); createTile(ch); added++;
    }
    if (added) { refresh(); save(); }
    return added;
  }

  function removeChannel(ch) {
    const t = tiles.get(ch); if (!t) return;
    try { t.api && t.api.pause(); } catch (_) {}
    t.el.remove(); tiles.delete(ch);
    channels = channels.filter((c) => c !== ch);
    const wasFocused = focused === ch;
    if (chatChannel === ch) chatChannel = null;
    if (wasFocused) setFocus(null);   // 大画面の配信を閉じたら、元のミュート状態に戻してグリッドへ
    refresh(); save();
  }

  function setFocus(ch) {
    const next = ch && channels.includes(ch) ? ch : null;
    // グリッド → 大画面 に入るときだけ保存（大画面どうしの切り替えでは上書きしない）
    if (next && !focused) preFocusMute = new Map(channels.map((c) => [c, tiles.get(c).muted]));
    focused = next;
    if (focused) {
      // 大画面の配信だけ音を出し、他はミュート
      for (const c of channels) setMuted(c, c !== focused, true);
      if (document.body.classList.contains("chat-open")) setChat(focused);
    } else if (preFocusMute) {
      // 大画面をやめたら元のミュート状態に戻す
      const restore = preFocusMute; preFocusMute = null;
      for (const [c, m] of restore) if (tiles.has(c)) setMuted(c, m, true);
    }
    channels.forEach(updateTileUI);
    refresh();
  }

  // ---------- layout ----------
  function fitGrid(n, W, H, g) {
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      let w = (W - g * (cols - 1)) / cols, h = w / ASPECT;
      const maxH = (H - g * (rows - 1)) / rows;
      if (h > maxH) { h = maxH; w = h * ASPECT; }
      if (!best || w > best.w + 0.5) best = { cols, rows, w, h };
    }
    return best;
  }

  function computeRects() {
    const W = stage.clientWidth, H = stage.clientHeight, g = 8;
    const n = channels.length, rects = new Map();
    if (!n) return rects;

    if (!focused) {
      // 均等割りグリッド（最終行は中央寄せ）
      const { cols, rows, w, h } = fitGrid(n, W, H, g);
      const y0 = (H - (rows * h + (rows - 1) * g)) / 2;
      channels.forEach((ch, i) => {
        const r = Math.floor(i / cols), c = i % cols;
        const inRow = r < rows - 1 ? cols : n - cols * (rows - 1);
        const x0 = (W - (inRow * w + (inRow - 1) * g)) / 2;
        rects.set(ch, { x: x0 + c * (w + g), y: y0 + r * (h + g), w, h, small: w < 260 });
      });
      return rects;
    }

    // フォーカス：上に大画面、下に他の配信を小さく並べる
    const others = channels.filter((c) => c !== focused);
    let th = 0, tw = 0;
    if (others.length) {
      th = Math.max(70, Math.min(170, H * 0.2));
      tw = th * ASPECT;
      const need = others.length * tw + (others.length - 1) * g;
      if (need > W) { tw = (W - (others.length - 1) * g) / others.length; th = tw / ASPECT; }
    }
    const mainH = others.length ? H - th - g : H;
    let mw = W, mh = mw / ASPECT;
    if (mh > mainH) { mh = mainH; mw = mh * ASPECT; }
    // 大画面＋サムネ列をまとめて縦中央に
    const blockH = mh + (others.length ? g + th : 0);
    const top = Math.max(0, (H - blockH) / 2);
    rects.set(focused, { x: (W - mw) / 2, y: top, w: mw, h: mh, small: false });

    const rowW = others.length * tw + (others.length - 1) * g;
    const sx = (W - rowW) / 2, sy = top + mh + g;
    others.forEach((ch, i) => rects.set(ch, { x: sx + i * (tw + g), y: sy, w: tw, h: th, small: true }));
    return rects;
  }

  function layout() {
    const rects = computeRects();
    for (const [ch, r] of rects) {
      const el = tiles.get(ch).el, s = el.style;
      s.left = r.x + "px"; s.top = r.y + "px"; s.width = r.w + "px"; s.height = r.h + "px";
      el.classList.toggle("small", r.small);
    }
  }

  // ---------- chips / chat ----------
  function renderChips() {
    chips.innerHTML = "";
    channels.forEach((ch, i) => {
      const d = document.createElement("div");
      d.className = "chip " + (isYT(ch) ? "pf-youtube" : "pf-twitch") + (focused === ch ? " focused" : "");
      d.innerHTML = `<i class="pf"></i><span></span><button title="削除">✕</button>`;
      d.querySelector("span").textContent = nameOf(ch);
      d.querySelector("span").title = i < 9 ? "キー " + (i + 1) : "";
      d.querySelector("span").onclick = () => setFocus(focused === ch ? null : ch);
      d.querySelector("button").onclick = () => removeChannel(ch);
      chips.appendChild(d);
    });
  }

  function renderChatSelect() {
    const sel = $("#chatSel");
    sel.innerHTML = "";
    for (const c of channels) {
      const o = document.createElement("option");
      o.value = c;
      o.textContent = `${isYT(c) ? "[YT]" : "[Twitch]"} ${nameOf(c)} のチャット`;
      sel.appendChild(o);
    }
    if (chatChannel) sel.value = chatChannel;
  }

  function chatSrc(ch) {
    const host = encodeURIComponent(HOST);
    if (!isYT(ch)) return `https://www.twitch.tv/embed/${ch}/chat?parent=${host}&darkpopout`;
    const vid = ch.startsWith("yt:") ? ytId(ch) : tiles.get(ch)?.videoId;
    if (!vid) return null;
    const dark = "&dark_theme=1";
    return `https://www.youtube.com/live_chat?v=${vid}&embed_domain=${host}${dark}`;
  }

  function setChat(ch, force = false) {
    const frame = $("#chatFrame");
    if (!HOST || !ch) { frame.removeAttribute("src"); frame.removeAttribute("srcdoc"); chatChannel = null; return; }
    if (chatChannel === ch && !force) return;
    chatChannel = ch;
    $("#chatSel").value = ch;
    const src = chatSrc(ch);
    if (src) { frame.removeAttribute("srcdoc"); frame.src = src; }
    else {
      frame.removeAttribute("src");
      frame.srcdoc = `<body style="background:#2b2d31;color:#949ba4;font:13px sans-serif;display:grid;place-items:center;height:90vh;text-align:center">
        配信の読み込み後にチャットを表示します</body>`;
    }
  }

  function toggleChat(force) {
    const open = force ?? !document.body.classList.contains("chat-open");
    document.body.classList.toggle("chat-open", open);
    $("#chatBtn").classList.toggle("on", open);
    // 大画面の配信があれば常にそれを優先
    if (open) setChat(focused || (channels.includes(chatChannel) ? chatChannel : channels[0]));
    requestAnimationFrame(layout);
  }

  function refresh() {
    document.body.classList.toggle("is-empty", channels.length === 0);
    $("#gridBtn").style.display = focused ? "" : "none";
    renderChips(); renderChatSelect();
    if (document.body.classList.contains("chat-open") && !channels.includes(chatChannel)) setChat(focused || channels[0]);
    layout();
  }

  // ---------- events ----------
  $("#addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const { ok, errors } = parseInput($("#chInput").value);
    const n = addChannels(ok);
    if (errors.includes("handle")) toast((n ? `${n} 件追加しました。` : "") + "YouTube の @ハンドル には対応していません。配信ページの URL（watch?v=… など）を貼ってください");
    else if (!ok.length) toast("チャンネル名 / URL が正しくありません");
    else toast(n ? `${n} 件追加しました` : "すでに追加済みです");
    $("#chInput").value = "";
  });
  $("#gridBtn").onclick = () => setFocus(null);
  $("#chatBtn").onclick = () => toggleChat();
  $("#chatClose").onclick = () => toggleChat(false);
  $("#chatSel").onchange = (e) => setChat(e.target.value);
  $("#shareBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); toast("URL をコピーしました"); }
    catch (_) { prompt("この URL を共有してください", location.href); }
  };

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, select, textarea")) return;
    if (e.key === "Escape") { if (ctxCh) closeCtx(); else setFocus(null); }
    else if (e.key === "c" || e.key === "C") toggleChat();
    else if (/^[1-9]$/.test(e.key)) {
      const ch = channels[+e.key - 1];
      if (ch) setFocus(focused === ch ? null : ch);
    }
  });

  // ウィンドウサイズ変更時はアニメーションなしで再配置
  let resizeTimer;
  new ResizeObserver(() => {
    document.body.classList.add("no-anim");
    layout();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => document.body.classList.remove("no-anim"), 150);
  }).observe(stage);

  // ---------- init ----------
  document.body.classList.add("no-anim");
  addChannels(load());
  refresh();
  setTimeout(() => document.body.classList.remove("no-anim"), 50);
})();
</script>
</body>
</html>
